name: Sync LokalBot release

on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['bucket/lokalbot.json', 'scripts/**', '.github/workflows/sync-lokalbot.yml']

permissions:
  contents: write

concurrency:
  group: sync-lokalbot
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'stevyhacker/scoop-bucket'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Test synchronizer
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Verify release and synchronize manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_lokalbot.py
      - name: Validate and publish manifest update
        run: |
          python3 -m json.tool bucket/lokalbot.json > /dev/null
          git diff --check
          if git diff --quiet -- bucket/lokalbot.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bucket/lokalbot.json
          git commit -m 'Synchronize LokalBot Scoop manifest with verified stable release'
          git push origin HEAD:main
